<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>影響力の正体 30日チャレンジ</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1F2A44">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="30日チャレンジ">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<style>
  :root{
    --ink:#1F2A44;
    --ink-soft:#3c4a6b;
    --paper:#FBF8F2;
    --paper-line:#E4DCC9;
    --gold:#B8862B;
    --gold-soft:#F5EEDD;
    --done:#8A9A7E;
    --text:#2A2A28;
    --text-muted:#7c7568;
    --serif: "Noto Serif JP", "Hiragino Mincho ProN", serif;
    --sans: "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--text);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:640px;margin:0 auto;padding:32px 20px 80px;}

  header.top{
    text-align:left;
    padding-bottom:20px;
    border-bottom:2px solid var(--ink);
    margin-bottom:24px;
  }
  .kicker{
    font-family:var(--sans);
    font-size:12px;
    letter-spacing:.08em;
    color:var(--gold);
    margin-bottom:6px;
  }
  h1{
    font-family:var(--serif);
    font-size:26px;
    line-height:1.4;
    margin:0 0 4px;
    color:var(--ink);
    font-weight:600;
  }
  .sub{
    font-family:var(--serif);
    font-size:14px;
    color:var(--text-muted);
    margin:0;
  }

  .progress-row{
    display:flex;
    align-items:baseline;
    gap:14px;
    margin:22px 0 28px;
  }
  .streak-num{
    font-family:var(--serif);
    font-size:44px;
    font-weight:600;
    color:var(--ink);
    line-height:1;
  }
  .streak-label{
    font-size:13px;
    color:var(--text-muted);
  }
  .bar-track{
    height:3px;
    background:var(--paper-line);
    width:100%;
    margin-top:14px;
    position:relative;
  }
  .bar-fill{
    height:3px;
    background:var(--gold);
    transition:width .4s ease;
  }

  .week{margin-bottom:8px;}
  .week-head{
    font-family:var(--serif);
    font-size:19px;
    font-weight:600;
    color:var(--ink);
    padding:26px 0 12px;
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    border-bottom:1.5px solid var(--paper-line);
  }
  .week-head .wk-count{
    font-size:13.5px;
    color:var(--text-muted);
    font-family:var(--sans);
  }

  .day{
    display:flex;
    gap:20px;
    padding:26px 0;
    border-bottom:1px solid var(--paper-line);
    align-items:flex-start;
    cursor:pointer;
  }
  .day:last-child{border-bottom:none;}
  .day-num{
    font-family:var(--serif);
    font-size:15px;
    color:var(--text-muted);
    width:56px;
    flex-shrink:0;
    padding-top:3px;
  }
  .day-num .n{
    display:block;
    font-size:34px;
    color:var(--ink);
    font-weight:600;
    line-height:1.15;
  }
  .day.done .day-num .n{color:var(--done);}
  .day-body{flex:1;min-width:0;}
  .day-title{
    font-size:19px;
    font-weight:700;
    color:var(--text);
    margin:0 0 10px;
    line-height:1.5;
  }
  .day.done .day-title{color:var(--text-muted);text-decoration:line-through;text-decoration-color:var(--paper-line);}
  .day-jdi{
    font-family:var(--serif);
    font-size:16.5px;
    line-height:1.95;
    color:var(--text);
    margin:0;
  }
  .day.done .day-jdi{color:var(--text-muted);}
  .check{
    width:32px;height:32px;
    border:2px solid var(--ink);
    flex-shrink:0;
    margin-top:4px;
    display:flex;align-items:center;justify-content:center;
    transition:all .15s ease;
  }
  .day.done .check{
    background:var(--done);
    border-color:var(--done);
  }
  .check svg{opacity:0;width:18px;height:18px;}
  .day.done .check svg{opacity:1;}

  .footer-note{
    margin-top:40px;
    padding-top:20px;
    border-top:2px solid var(--ink);
    font-family:var(--serif);
    font-size:13px;
    color:var(--text-muted);
    line-height:1.8;
  }

  /* modal */
  .modal-bg{
    position:fixed;inset:0;
    background:rgba(31,42,68,.55);
    display:none;
    align-items:center;justify-content:center;
    z-index:50;
    padding:20px;
  }
  .modal-bg.open{display:flex;}
  .modal{
    background:var(--paper);
    max-width:360px;
    width:100%;
    padding:20px;
    text-align:center;
    border-radius:10px;
  }
  .modal h2{
    font-family:var(--serif);
    font-size:20px;
    color:var(--ink);
    margin:16px 0 6px;
  }
  .modal p.mini{
    font-size:13px;
    color:var(--text-muted);
    margin:0 0 18px;
  }

  /* shareable streak card — CSS rendition of the reference design */
  .share-card{
    position:relative;
    aspect-ratio:1;
    border-radius:8px;
    overflow:hidden;
    background: var(--card-bg, linear-gradient(#1F2A44,#111826));
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.08);
  }
  .share-card::before{
    content:'';
    position:absolute;
    inset:9%;
    border:1px solid var(--gold);
    border-radius:2px;
    pointer-events:none;
  }
  .share-card-inner{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:12% 10% 10%;
    text-align:center;
  }
  .sc-kicker{
    font-family:var(--serif);
    font-size:3.6vw;
    min-font-size:12px;
    color:var(--gold);
    margin-bottom:6%;
    letter-spacing:.02em;
  }
  .sc-number{
    font-family:var(--serif);
    font-weight:700;
    font-size:22vw;
    line-height:.9;
    color:#FBF8F2;
    text-shadow: 0 0 18px rgba(184,134,43,.85), 0 0 42px rgba(184,134,43,.5);
    margin-bottom:2%;
  }
  .sc-days{
    font-family:var(--sans);
    font-size:5vw;
    letter-spacing:.5em;
    color:var(--gold-soft);
    margin-bottom:3%;
    padding-left:.5em; /* optical centering for the letter-spacing */
  }
  .sc-achieved{
    font-family:var(--serif);
    font-size:5.5vw;
    font-weight:600;
    color:#FBF8F2;
    letter-spacing:.15em;
    margin-bottom:4%;
  }
  .sc-remain{
    font-family:var(--sans);
    font-size:3.2vw;
    color:#c9d0c2;
    margin-bottom:6%;
  }
  .sc-divider{
    width:22%;
    height:1px;
    background:rgba(184,134,43,.55);
    margin-bottom:6%;
  }
  .sc-sub{
    font-family:var(--sans);
    font-size:2.9vw;
    color:rgba(251,248,242,.7);
    margin-bottom:2%;
  }
  .sc-author{
    font-family:var(--serif);
    font-size:2.9vw;
    color:rgba(251,248,242,.7);
  }

  .modal-actions{display:flex;gap:10px;margin-top:18px;}
  .btn{
    flex:1;
    padding:14px;
    font-size:14.5px;
    font-family:var(--sans);
    border:1.5px solid var(--ink);
    border-radius:6px;
    background:transparent;
    color:var(--ink);
    cursor:pointer;
  }
  .btn.primary{
    background:var(--ink);
    color:#fff;
  }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="kicker">『影響力の正体』公式ワークブック</div>
    <h1>30日実践チャレンジ</h1>
    <p class="sub">「知っている」を「できる」に変える30日間</p>
  </header>

  <div class="progress-row">
    <div>
      <div class="streak-num" id="streakNum">0</div>
      <div class="streak-label">連続達成日数</div>
    </div>
    <div style="flex:1">
      <div class="streak-label" id="progressText">0 / 30 完了</div>
      <div class="bar-track"><div class="bar-fill" id="barFill" style="width:0%"></div></div>
    </div>
  </div>

  <div id="weeks"></div>

  <div class="footer-note">
    5日達成するごとに、シェア用のカードが作れます。がんばりを、そのままSNSに置いていってください。
  </div>
</div>

<div class="modal-bg" id="modalBg">
  <div class="modal">
    <div class="share-card" id="shareCard">
      <div class="share-card-inner">
        <div class="sc-kicker">『影響力の正体』30日チャレンジ</div>
        <div class="sc-number" id="scNumber">5</div>
        <div class="sc-days">DAYS</div>
        <div class="sc-achieved">連続達成</div>
        <div class="sc-remain" id="scRemain">残り 25 日</div>
        <div class="sc-divider"></div>
        <div class="sc-sub">「知っている」を「できる」に変える30日間</div>
        <div class="sc-author">中島侑子</div>
      </div>
    </div>
    <canvas id="shareCanvas" width="1080" height="1080" style="display:none"></canvas>
    <h2 id="modalTitle">5日連続、達成です</h2>
    <p class="mini">画像を保存して、シェアできます</p>
    <div class="modal-actions">
      <button class="btn" id="closeBtn">閉じる</button>
      <button class="btn primary" id="saveBtn">画像を保存</button>
    </div>
  </div>
</div>

<script>
const DATA = [
  {week:1, theme:"土台をつくる週", items:[
    {day:1, num:"001", title:"「なぜ」を１行、紙に書く", jdi:"あなたが今やっている仕事や、挑戦していることについて、「なぜ、自分はこれをやっているのか」を、１行だけ紙に書いてみてください。すらすら書けなくても大丈夫。その問いと向き合うことから、すべてが始まります。"},
    {day:2, num:"003", title:"「あなたならできる」を伝える", jdi:"今日、誰かひとりに「あなたなら、これはできるよ」と、具体的な理由を添えて伝えてみてください。「前にあれができたんだから」と、過去の小さな成功をひとつ思い出させる。それだけで、相手は、前に進みやすくなります。"},
    {day:3, num:"004", title:"未来の解像度を上げる問いをする", jdi:"動いてほしい誰かに、こう聞いてみてください。「それが叶ったとき、どこで、誰と、何をしている？」。相手の未来の解像度を一段上げる問いが、説得よりもよほど人を動かします。"},
    {day:4, num:"006", title:"「三年は続ける」と紙に書いて貼る", jdi:"今やっていることを、「何があっても三年は続ける」と紙に書き、日付を入れて、目に入る場所に貼ってみてください。"},
    {day:5, num:"007", title:"見返りを期待せず先に差し出す", jdi:"家族か同僚に何かひとつだけ、見返りを期待せず先に差し出してみましょう。お茶一杯でも、削った鉛筆でも、資料一枚でも。"},
    {day:6, num:"009", title:"共通点になりそうな事実を用意する", jdi:"次に誰かと会う前に、相手との「共通点になりそうな事実」をひとつ用意しておきましょう。出身地でも趣味でも家族構成でも、何でもかまいません。"},
    {day:7, num:"010", title:"相手の話し方に、さりげなく合わせる", jdi:"次に誰かと話すとき、相手の話すスピードやうなずきに、さりげなく合わせてみてください。言葉ではなく体で「わかりますよ」を伝える練習です。"},
    {day:8, num:"011", title:"肩書きを自己紹介の冒頭に置く", jdi:"自分の経歴・経験・数字の中から、肩書きとして打ち出せるものをひとつ選び、自己紹介の冒頭に置いてみてください。"},
  ]},
  {week:2, theme:"見え方と言葉を整える週", items:[
    {day:9, num:"015", title:"資料のばらつきをひとつそろえる", jdi:"自分の資料や書類を見わたして、フォント・色・余白にばらつきがあれば、ひとつでよいのでそろえてみてください。"},
    {day:10, num:"016", title:"「素敵」の理由を五つ書き出す", jdi:"「いいな」と思った人やお店をひとつ選び、なぜ素敵なのかを、５つ具体的に書き出してみてください。感覚を設計図に変える練習です。"},
    {day:11, num:"017", title:"最初の０.５秒の場所を完璧に整える", jdi:"相手が最初の０・５秒で見る場所をひとつ選び、そこだけ完璧に整えてみましょう。"},
    {day:12, num:"020", title:"具体的な場面を描写して添える", jdi:"誰かに何かをすすめるとき、「まず明日の朝、○○する場面」をひとつだけ具体的に描写して、添えてみてください。"},
    {day:13, num:"021", title:"「〜なので」をひとつ足す", jdi:"頼みごとや声かけに、「〜なので、〜してください」の形をひとつ足してみてください。理由はささやかでかまいません。"},
    {day:14, num:"022", title:"「もし〜なら」を一緒に決めて手渡す", jdi:"動いてほしい相手（部下・子ども・お客さま）をひとり思い浮かべ、「もし（いつもの場面）になったら、（してほしい行動）をする」を一緒に決めて手渡してみてください。"},
    {day:15, num:"024", title:"小さな本音をひとつ打ち明ける", jdi:"信頼を深めたい相手に、これまで言えずにいた小さな本音を、ひとつだけ打ち明けてみてください。"},
  ]},
  {week:3, theme:"しくみで巻き込む週", items:[
    {day:16, num:"026", title:"「最初の一歩」を半分にする方法を渡す", jdi:"動かしたい相手に取ってほしい行動をひとつ選び、その人の「最初の一歩を半分にする方法」を３つ書き出して、ひとつ手渡してみてください。"},
    {day:17, num:"028", title:"選択肢を数え、３つ以下に絞る", jdi:"相手に示している選択肢の数を、数えてみてください。４つ以上あるなら、３つ以下に絞ってみましょう。"},
    {day:18, num:"029", title:"「数字」と「期日」を入れて伝える", jdi:"部下・子ども・チームに頼みたいことをひとつ、「数字」と「期日」を入れた言葉に書き換えて、相手に伝えてみてください。"},
    {day:19, num:"030", title:"相手にも選んでもらう", jdi:"次に何かを決めるとき、相手にもひとつ、選んでもらってください。色でも名前でも順番でも。「一緒につくった」感覚が愛着を生みます。"},
    {day:20, num:"031", title:"今月の目標を、誰かに宣言する", jdi:"今月の目標をひとつ、信頼できる誰かに、口に出して宣言してみてください。紙に書いて、誰かに渡してもかまいません。"},
    {day:21, num:"033", title:"久しぶりの知人に、自分から連絡する", jdi:"今月、毎日会う身近な人ではなく、半年以上会っていない知人のうちひとりだけに、自分から連絡してみてください。"},
    {day:22, num:"035", title:"「みんなで繰り返すこと」をひとつ作る", jdi:"自分のチームや家庭に、「みんなで決まって繰り返すこと」をひとつつくってみてください。月に１回でも、かまいません。"},
    {day:23, num:"036", title:"「私たち」と呼べる名前をつける", jdi:"自分のチームやコミュニティに、「私たち」と呼べる固有名詞（グループ名・合言葉・あだ名）を、つけてみてください。"},
  ]},
  {week:4, theme:"影響力を守り、育てる週", items:[
    {day:24, num:"038", title:"心の中の「予言」を書き換える", jdi:"自分の関わる人（部下・子ども・家族）に、心の中でかけている「予言」をひとつ書き出し、否定的なら、今すぐ書き換えてみてください。"},
    {day:25, num:"039", title:"「まだできない」に言いかえる", jdi:"自分や相手の「できない」「難しい」を今から「まだできない」「まだ難しい」に言いかえてみてください。あなたの一語が、相手を動かします。"},
    {day:26, num:"040", title:"否定形を肯定形に書きかえる", jdi:"誰かに送る言葉やメッセージを見直し、否定形がひとつでもあれば、肯定形に書きかえてみてください。"},
    {day:27, num:"042", title:"「昨日の自分」と比べ直す", jdi:"誰かと比べて落ち込んだら、「昨日の自分」と比べ直し、できたことをひとつ、書き出してみてください。"},
    {day:28, num:"044", title:"一往復で終わらせず、もう一通返す", jdi:"直接会えない相手と、「一往復では終わらないやりとり」を今月ひとつ続けてみてください。"},
    {day:29, num:"046", title:"伝えたい話に「感情」か「物語」をのせる", jdi:"人に伝えたいことをひとつ選び、そこに「感情」か「物語」をひとつ加えてみてください。"},
    {day:30, num:"047", title:"「誰のために使うか」を書いて貼る", jdi:"本書で学んだ影響力を「誰を、幸せにするために使うか」を１行で書いて、目に入る場所に貼ってみてください。"},
  ]},
];

const TOTAL = 30;
let state = {};

async function loadState(){
  try{
    const raw = localStorage.getItem('influence-30day-status');
    state = raw ? JSON.parse(raw) : {};
  }catch(e){
    state = {};
  }
  render();
}

async function saveState(){
  try{
    localStorage.setItem('influence-30day-status', JSON.stringify(state));
  }catch(e){
    console.error('save failed', e);
  }
}

function currentStreak(){
  let s = 0;
  for(let d=1; d<=TOTAL; d++){
    if(state[d]){ s++; } else { break; }
  }
  return s;
}

function completedCount(){
  return Object.values(state).filter(Boolean).length;
}

function render(){
  const container = document.getElementById('weeks');
  container.innerHTML = '';
  DATA.forEach(w=>{
    const wkDone = w.items.filter(it=>state[it.day]).length;
    const weekEl = document.createElement('div');
    weekEl.className = 'week';
    weekEl.innerHTML = `<div class="week-head"><span>Week${w.week}　${w.theme}</span><span class="wk-count">${wkDone}/${w.items.length}</span></div>`;
    w.items.forEach(it=>{
      const done = !!state[it.day];
      const row = document.createElement('div');
      row.className = 'day' + (done ? ' done' : '');
      row.innerHTML = `
        <div class="day-num">出典${it.num}<span class="n">${it.day}</span></div>
        <div class="day-body">
          <p class="day-title">${it.title}</p>
          <p class="day-jdi">${it.jdi}</p>
        </div>
        <div class="check"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"><path d="M4 12l6 6L20 6"/></svg></div>
      `;
      row.addEventListener('click', ()=>toggleDay(it.day));
      weekEl.appendChild(row);
    });
    container.appendChild(weekEl);
  });

  const streak = currentStreak();
  const done = completedCount();
  document.getElementById('streakNum').textContent = streak;
  document.getElementById('progressText').textContent = `${done} / ${TOTAL} 完了`;
  document.getElementById('barFill').style.width = (done/TOTAL*100) + '%';
}

function toggleDay(day){
  const wasOn = !!state[day];
  state[day] = !wasOn;
  saveState();
  render();
  if(!wasOn){
    const streak = currentStreak();
    if(streak > 0 && streak % 5 === 0){
      showShareCard(streak);
    }
  }
}

// レベル：5日=1 … 30日=6（達成日数に応じて背景の輝きだけ段階的に強くする）
function streakLevel(streak){
  return Math.min(6, Math.max(1, Math.round(streak / 5)));
}

function cardBackground(level, isPeak){
  if(level <= 2) return 'linear-gradient(180deg, #1F2A44, #111826)';
  if(level <= 4) return 'radial-gradient(circle at 50% 45%, #2b3a5e, #111826 75%)';
  return `radial-gradient(circle at 50% 45%, ${isPeak ? '#4a3819' : '#2f3f66'}, #1F2A44 55%, #0d1220)`;
}

// CSSカードと同じ見た目を、保存用にcanvasへそのまま再現する
function drawShareCard(streak){
  const canvas = document.getElementById('shareCanvas');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const cx = W/2;
  const level = streakLevel(streak);
  const isPeak = streak >= TOTAL;

  // 背景
  let grad;
  if(level <= 2){
    grad = ctx.createLinearGradient(0,0,0,H);
    grad.addColorStop(0, '#1F2A44');
    grad.addColorStop(1, '#111826');
  } else if(level <= 4){
    grad = ctx.createRadialGradient(cx,H*0.45,40,cx,H*0.45,W*0.75);
    grad.addColorStop(0, '#2b3a5e');
    grad.addColorStop(1, '#111826');
  } else {
    grad = ctx.createRadialGradient(cx,H*0.45,40,cx,H*0.45,W*0.8);
    grad.addColorStop(0, isPeak ? '#4a3819' : '#2f3f66');
    grad.addColorStop(0.55, '#1F2A44');
    grad.addColorStop(1, '#0d1220');
  }
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,W,H);

  // 内側のゴールド枠（CSSの ::before と同じ 9% inset）
  const inset = W*0.09;
  ctx.strokeStyle = '#B8862B';
  ctx.lineWidth = 2;
  ctx.strokeRect(inset, inset, W-inset*2, H-inset*2);

  ctx.textAlign = 'center';

  ctx.fillStyle = '#B8862B';
  ctx.font = '32px "Noto Serif JP", serif';
  ctx.fillText('『影響力の正体』30日チャレンジ', cx, 230);

  // 数字（レベルが上がるほど光彩が強くなる）
  ctx.save();
  ctx.shadowColor = '#B8862B';
  ctx.shadowBlur = 14 + level*8;
  ctx.fillStyle = '#FBF8F2';
  ctx.font = 'bold 320px "Noto Serif JP", serif';
  ctx.fillText(streak, cx, 480);
  ctx.restore();

  ctx.fillStyle = '#F5EEDD';
  ctx.font = '46px "Noto Sans JP", sans-serif';
  ctx.fillText('D A Y S', cx, 580);

  ctx.fillStyle = '#FBF8F2';
  ctx.font = 'bold 56px "Noto Serif JP", serif';
  ctx.fillText('連 続 達 成', cx, 660);

  ctx.fillStyle = '#c9d0c2';
  ctx.font = '32px "Noto Sans JP", sans-serif';
  ctx.fillText(isPeak ? '30日、走りきりました。' : `残り ${TOTAL - streak} 日`, cx, 730);

  // divider
  ctx.strokeStyle = 'rgba(184,134,43,0.55)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(cx-120, 800);
  ctx.lineTo(cx+120, 800);
  ctx.stroke();

  ctx.fillStyle = 'rgba(251,248,242,0.7)';
  ctx.font = '28px "Noto Sans JP", sans-serif';
  ctx.fillText('「知っている」を「できる」に変える30日間', cx, 850);
  ctx.font = '28px "Noto Serif JP", serif';
  ctx.fillText('中島侑子', cx, 895);
}

function showShareCard(streak){
  const level = streakLevel(streak);
  const isPeak = streak >= TOTAL;

  // オンスクリーン表示はCSSカードで（くっきり表示・端末負荷も軽い）
  const card = document.getElementById('shareCard');
  card.style.setProperty('--card-bg', cardBackground(level, isPeak));
  document.getElementById('scNumber').textContent = streak;
  document.getElementById('scRemain').textContent =
    isPeak ? '30日、走りきりました。' : `残り ${TOTAL - streak} 日`;

  // 保存用PNGは同じデザインをcanvasに描画
  drawShareCard(streak);

  document.getElementById('modalTitle').textContent =
    isPeak ? '30日間、走りきりました' : `${streak}日連続、達成です`;
  document.getElementById('modalBg').classList.add('open');
}

document.getElementById('closeBtn').addEventListener('click', ()=>{
  document.getElementById('modalBg').classList.remove('open');
});
document.getElementById('saveBtn').addEventListener('click', ()=>{
  const canvas = document.getElementById('shareCanvas');
  const link = document.createElement('a');
  link.download = 'influence-30day-streak.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
});

loadState();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
