<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>影響力の正体 30日チャレンジ</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1F2A44">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="30日チャレンジ">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<style>
  :root{
    --ink:#1F2A44;
    --ink-soft:#3c4a6b;
    --paper:#FBF8F2;
    --paper-line:#E4DCC9;
    --gold:#B8862B;
    --gold-soft:#F5EEDD;
    --done:#8A9A7E;
    --text:#2A2A28;
    --text-muted:#7c7568;
    --serif: "Noto Serif JP", "Hiragino Mincho ProN", serif;
    --sans: "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--text);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:640px;margin:0 auto;padding:32px 20px 80px;}

  header.top{
    text-align:left;
    padding-bottom:20px;
    border-bottom:2px solid var(--ink);
    margin-bottom:24px;
  }
  .kicker{
    font-family:var(--sans);
    font-size:12px;
    letter-spacing:.08em;
    color:var(--gold);
    margin-bottom:6px;
  }
  h1{
    font-family:var(--serif);
    font-size:26px;
    line-height:1.4;
    margin:0 0 4px;
    color:var(--ink);
    font-weight:600;
  }
  .sub{
    font-family:var(--serif);
    font-size:14px;
    color:var(--text-muted);
    margin:0;
  }

  .progress-row{
    display:flex;
    align-items:baseline;
    gap:14px;
    margin:22px 0 28px;
  }
  .streak-num{
    font-family:var(--serif);
    font-size:44px;
    font-weight:600;
    color:var(--ink);
    line-height:1;
  }
  .streak-label{
    font-size:13px;
    color:var(--text-muted);
  }
  .bar-track{
    height:3px;
    background:var(--paper-line);
    width:100%;
    margin-top:14px;
    position:relative;
  }
  .bar-fill{
    height:3px;
    background:var(--gold);
    transition:width .4s ease;
  }

  .week{margin-bottom:8px;}
  .week-head{
    font-family:var(--serif);
    font-size:15px;
    color:var(--ink);
    padding:18px 0 8px;
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    border-bottom:1px solid var(--paper-line);
  }
  .week-head .wk-count{
    font-size:12px;
    color:var(--text-muted);
    font-family:var(--sans);
  }

  .day{
    display:flex;
    gap:14px;
    padding:16px 0;
    border-bottom:1px solid var(--paper-line);
    align-items:flex-start;
    cursor:pointer;
  }
  .day:last-child{border-bottom:none;}
  .day-num{
    font-family:var(--serif);
    font-size:13px;
    color:var(--text-muted);
    width:44px;
    flex-shrink:0;
    padding-top:2px;
  }
  .day-num .n{
    display:block;
    font-size:20px;
    color:var(--ink);
    font-weight:600;
  }
  .day.done .day-num .n{color:var(--done);}
  .day-body{flex:1;min-width:0;}
  .day-title{
    font-size:14.5px;
    font-weight:600;
    color:var(--text);
    margin:0 0 4px;
  }
  .day.done .day-title{color:var(--text-muted);text-decoration:line-through;text-decoration-color:var(--paper-line);}
  .day-jdi{
    font-family:var(--serif);
    font-size:13.5px;
    line-height:1.75;
    color:var(--text);
    margin:0;
  }
  .day.done .day-jdi{color:var(--text-muted);}
  .check{
    width:22px;height:22px;
    border:1.5px solid var(--ink);
    flex-shrink:0;
    margin-top:2px;
    display:flex;align-items:center;justify-content:center;
    transition:all .15s ease;
  }
  .day.done .check{
    background:var(--done);
    border-color:var(--done);
  }
  .check svg{opacity:0;width:13px;height:13px;}
  .day.done .check svg{opacity:1;}

  .footer-note{
    margin-top:40px;
    padding-top:20px;
    border-top:2px solid var(--ink);
    font-family:var(--serif);
    font-size:13px;
    color:var(--text-muted);
    line-height:1.8;
  }

  /* modal */
  .modal-bg{
    position:fixed;inset:0;
    background:rgba(31,42,68,.55);
    display:none;
    align-items:center;justify-content:center;
    z-index:50;
    padding:20px;
  }
  .modal-bg.open{display:flex;}
  .modal{
    background:var(--paper);
    max-width:340px;
    width:100%;
    padding:24px;
    text-align:center;
  }
  .modal h2{
    font-family:var(--serif);
    font-size:19px;
    color:var(--ink);
    margin:14px 0 6px;
  }
  .modal p.mini{
    font-size:12.5px;
    color:var(--text-muted);
    margin:0 0 18px;
  }
  #shareCanvas{
    width:100%;
    height:auto;
    display:block;
    margin-bottom:18px;
  }
  .modal-actions{display:flex;gap:10px;}
  .btn{
    flex:1;
    padding:12px;
    font-size:13.5px;
    font-family:var(--sans);
    border:1.5px solid var(--ink);
    background:transparent;
    color:var(--ink);
    cursor:pointer;
  }
  .btn.primary{
    background:var(--ink);
    color:#fff;
  }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="kicker">『影響力の正体』公式ワークブック</div>
    <h1>30日実践チャレンジ</h1>
    <p class="sub">「知っている」を「できる」に変える30日間</p>
  </header>

  <div class="progress-row">
    <div>
      <div class="streak-num" id="streakNum">0</div>
      <div class="streak-label">連続達成日数</div>
    </div>
    <div style="flex:1">
      <div class="streak-label" id="progressText">0 / 30 完了</div>
      <div class="bar-track"><div class="bar-fill" id="barFill" style="width:0%"></div></div>
    </div>
  </div>

  <div id="weeks"></div>

  <div class="footer-note">
    5日達成するごとに、シェア用のカードが作れます。がんばりを、そのままSNSに置いていってください。
  </div>
</div>

<div class="modal-bg" id="modalBg">
  <div class="modal">
    <canvas id="shareCanvas" width="1080" height="1080"></canvas>
    <h2 id="modalTitle">5日連続、達成です</h2>
    <p class="mini">画像を保存して、シェアできます</p>
    <div class="modal-actions">
      <button class="btn" id="closeBtn">閉じる</button>
      <button class="btn primary" id="saveBtn">画像を保存</button>
    </div>
  </div>
</div>

<script>
const DATA = [
  {week:1, theme:"土台をつくる週", items:[
    {day:1, num:"001", title:"「なぜ」を１行、紙に書く", jdi:"あなたが今やっている仕事や、挑戦していることについて、「なぜ、自分はこれをやっているのか」を、１行だけ紙に書いてみてください。すらすら書けなくても大丈夫。その問いと向き合うことから、すべてが始まります。"},
    {day:2, num:"003", title:"「あなたならできる」を伝える", jdi:"今日、誰かひとりに「あなたなら、これはできるよ」と、具体的な理由を添えて伝えてみてください。「前にあれができたんだから」と、過去の小さな成功をひとつ思い出させる。それだけで、相手は、前に進みやすくなります。"},
    {day:3, num:"004", title:"未来の解像度を上げる問いをする", jdi:"動いてほしい誰かに、こう聞いてみてください。「それが叶ったとき、どこで、誰と、何をしている？」。相手の未来の解像度を一段上げる問いが、説得よりもよほど人を動かします。"},
    {day:4, num:"006", title:"「三年は続ける」と紙に書いて貼る", jdi:"今やっていることを、「何があっても三年は続ける」と紙に書き、日付を入れて、目に入る場所に貼ってみてください。"},
    {day:5, num:"007", title:"見返りを期待せず先に差し出す", jdi:"家族か同僚に何かひとつだけ、見返りを期待せず先に差し出してみましょう。お茶一杯でも、削った鉛筆でも、資料一枚でも。"},
    {day:6, num:"009", title:"共通点になりそうな事実を用意する", jdi:"次に誰かと会う前に、相手との「共通点になりそうな事実」をひとつ用意しておきましょう。出身地でも趣味でも家族構成でも、何でもかまいません。"},
    {day:7, num:"010", title:"相手の話し方に、さりげなく合わせる", jdi:"次に誰かと話すとき、相手の話すスピードやうなずきに、さりげなく合わせてみてください。言葉ではなく体で「わかりますよ」を伝える練習です。"},
    {day:8, num:"011", title:"肩書きを自己紹介の冒頭に置く", jdi:"自分の経歴・経験・数字の中から、肩書きとして打ち出せるものをひとつ選び、自己紹介の冒頭に置いてみてください。"},
  ]},
  {week:2, theme:"見え方と言葉を整える週", items:[
    {day:9, num:"015", title:"資料のばらつきをひとつそろえる", jdi:"自分の資料や書類を見わたして、フォント・色・余白にばらつきがあれば、ひとつでよいのでそろえてみてください。"},
    {day:10, num:"016", title:"「素敵」の理由を五つ書き出す", jdi:"「いいな」と思った人やお店をひとつ選び、なぜ素敵なのかを、５つ具体的に書き出してみてください。感覚を設計図に変える練習です。"},
    {day:11, num:"017", title:"最初の０.５秒の場所を完璧に整える", jdi:"相手が最初の０・５秒で見る場所をひとつ選び、そこだけ完璧に整えてみましょう。"},
    {day:12, num:"020", title:"具体的な場面を描写して添える", jdi:"誰かに何かをすすめるとき、「まず明日の朝、○○する場面」をひとつだけ具体的に描写して、添えてみてください。"},
    {day:13, num:"021", title:"「〜なので」をひとつ足す", jdi:"頼みごとや声かけに、「〜なので、〜してください」の形をひとつ足してみてください。理由はささやかでかまいません。"},
    {day:14, num:"022", title:"「もし〜なら」を一緒に決めて手渡す", jdi:"動いてほしい相手（部下・子ども・お客さま）をひとり思い浮かべ、「もし（いつもの場面）になったら、（してほしい行動）をする」を一緒に決めて手渡してみてください。"},
    {day:15, num:"024", title:"小さな本音をひとつ打ち明ける", jdi:"信頼を深めたい相手に、これまで言えずにいた小さな本音を、ひとつだけ打ち明けてみてください。"},
  ]},
  {week:3, theme:"しくみで巻き込む週", items:[
    {day:16, num:"026", title:"「最初の一歩」を半分にする方法を渡す", jdi:"動かしたい相手に取ってほしい行動をひとつ選び、その人の「最初の一歩を半分にする方法」を３つ書き出して、ひとつ手渡してみてください。"},
    {day:17, num:"028", title:"選択肢を数え、３つ以下に絞る", jdi:"相手に示している選択肢の数を、数えてみてください。４つ以上あるなら、３つ以下に絞ってみましょう。"},
    {day:18, num:"029", title:"「数字」と「期日」を入れて伝える", jdi:"部下・子ども・チームに頼みたいことをひとつ、「数字」と「期日」を入れた言葉に書き換えて、相手に伝えてみてください。"},
    {day:19, num:"030", title:"相手にも選んでもらう", jdi:"次に何かを決めるとき、相手にもひとつ、選んでもらってください。色でも名前でも順番でも。「一緒につくった」感覚が愛着を生みます。"},
    {day:20, num:"031", title:"今月の目標を、誰かに宣言する", jdi:"今月の目標をひとつ、信頼できる誰かに、口に出して宣言してみてください。紙に書いて、誰かに渡してもかまいません。"},
    {day:21, num:"033", title:"久しぶりの知人に、自分から連絡する", jdi:"今月、毎日会う身近な人ではなく、半年以上会っていない知人のうちひとりだけに、自分から連絡してみてください。"},
    {day:22, num:"035", title:"「みんなで繰り返すこと」をひとつ作る", jdi:"自分のチームや家庭に、「みんなで決まって繰り返すこと」をひとつつくってみてください。月に１回でも、かまいません。"},
    {day:23, num:"036", title:"「私たち」と呼べる名前をつける", jdi:"自分のチームやコミュニティに、「私たち」と呼べる固有名詞（グループ名・合言葉・あだ名）を、つけてみてください。"},
  ]},
  {week:4, theme:"影響力を守り、育てる週", items:[
    {day:24, num:"038", title:"心の中の「予言」を書き換える", jdi:"自分の関わる人（部下・子ども・家族）に、心の中でかけている「予言」をひとつ書き出し、否定的なら、今すぐ書き換えてみてください。"},
    {day:25, num:"039", title:"「まだできない」に言いかえる", jdi:"自分や相手の「できない」「難しい」を今から「まだできない」「まだ難しい」に言いかえてみてください。あなたの一語が、相手を動かします。"},
    {day:26, num:"040", title:"否定形を肯定形に書きかえる", jdi:"誰かに送る言葉やメッセージを見直し、否定形がひとつでもあれば、肯定形に書きかえてみてください。"},
    {day:27, num:"042", title:"「昨日の自分」と比べ直す", jdi:"誰かと比べて落ち込んだら、「昨日の自分」と比べ直し、できたことをひとつ、書き出してみてください。"},
    {day:28, num:"044", title:"一往復で終わらせず、もう一通返す", jdi:"直接会えない相手と、「一往復では終わらないやりとり」を今月ひとつ続けてみてください。"},
    {day:29, num:"046", title:"伝えたい話に「感情」か「物語」をのせる", jdi:"人に伝えたいことをひとつ選び、そこに「感情」か「物語」をひとつ加えてみてください。"},
    {day:30, num:"047", title:"「誰のために使うか」を書いて貼る", jdi:"本書で学んだ影響力を「誰を、幸せにするために使うか」を１行で書いて、目に入る場所に貼ってみてください。"},
  ]},
];

const TOTAL = 30;
let state = {};

async function loadState(){
  try{
    const raw = localStorage.getItem('influence-30day-status');
    state = raw ? JSON.parse(raw) : {};
  }catch(e){
    state = {};
  }
  render();
}

async function saveState(){
  try{
    localStorage.setItem('influence-30day-status', JSON.stringify(state));
  }catch(e){
    console.error('save failed', e);
  }
}

function currentStreak(){
  let s = 0;
  for(let d=1; d<=TOTAL; d++){
    if(state[d]){ s++; } else { break; }
  }
  return s;
}

function completedCount(){
  return Object.values(state).filter(Boolean).length;
}

function render(){
  const container = document.getElementById('weeks');
  container.innerHTML = '';
  DATA.forEach(w=>{
    const wkDone = w.items.filter(it=>state[it.day]).length;
    const weekEl = document.createElement('div');
    weekEl.className = 'week';
    weekEl.innerHTML = `<div class="week-head"><span>Week${w.week}　${w.theme}</span><span class="wk-count">${wkDone}/${w.items.length}</span></div>`;
    w.items.forEach(it=>{
      const done = !!state[it.day];
      const row = document.createElement('div');
      row.className = 'day' + (done ? ' done' : '');
      row.innerHTML = `
        <div class="day-num">出典${it.num}<span class="n">${it.day}</span></div>
        <div class="day-body">
          <p class="day-title">${it.title}</p>
          <p class="day-jdi">${it.jdi}</p>
        </div>
        <div class="check"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"><path d="M4 12l6 6L20 6"/></svg></div>
      `;
      row.addEventListener('click', ()=>toggleDay(it.day));
      weekEl.appendChild(row);
    });
    container.appendChild(weekEl);
  });

  const streak = currentStreak();
  const done = completedCount();
  document.getElementById('streakNum').textContent = streak;
  document.getElementById('progressText').textContent = `${done} / ${TOTAL} 完了`;
  document.getElementById('barFill').style.width = (done/TOTAL*100) + '%';
}

function toggleDay(day){
  const wasOn = !!state[day];
  state[day] = !wasOn;
  saveState();
  render();
  if(!wasOn){
    const streak = currentStreak();
    if(streak > 0 && streak % 5 === 0){
      showShareCard(streak);
    }
  }
}

function drawDiamond(ctx, x, y, size, color, alpha=1){
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(x, y);
  ctx.rotate(Math.PI/4);
  ctx.fillStyle = color;
  ctx.fillRect(-size/2, -size/2, size, size);
  ctx.restore();
}

function drawSparkle(ctx, x, y, size, color, alpha=1){
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(x, y);
  ctx.strokeStyle = color;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(-size, 0); ctx.lineTo(size, 0);
  ctx.moveTo(0, -size); ctx.lineTo(0, size);
  ctx.stroke();
  ctx.restore();
}

function drawShareCard(streak){
  const canvas = document.getElementById('shareCanvas');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const cx = W/2, cy = H/2;

  // level: 5日=1 … 30日=6（達成日数に応じて演出を段階的に強くする）
  const level = Math.min(6, Math.max(1, Math.round(streak / 5)));
  const isPeak = streak >= TOTAL;

  // --- 背景（レベルが上がるほど輝きが増す） ---
  let grad;
  if(level <= 2){
    grad = ctx.createLinearGradient(0,0,0,H);
    grad.addColorStop(0, '#1F2A44');
    grad.addColorStop(1, '#111826');
  } else if(level <= 4){
    grad = ctx.createRadialGradient(cx,cy,40,cx,cy,W*0.75);
    grad.addColorStop(0, '#2b3a5e');
    grad.addColorStop(1, '#111826');
  } else {
    grad = ctx.createRadialGradient(cx,cy,40,cx,cy,W*0.8);
    grad.addColorStop(0, isPeak ? '#4a3819' : '#2f3f66');
    grad.addColorStop(0.55, '#1F2A44');
    grad.addColorStop(1, '#0d1220');
  }
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,W,H);

  // --- 後光（サンバースト）：レベル3以上 ---
  if(level >= 3){
    const rays = level >= 6 ? 32 : (level >= 5 ? 24 : 16);
    ctx.save();
    ctx.translate(cx, cy);
    for(let i=0; i<rays; i++){
      ctx.rotate((Math.PI*2)/rays);
      ctx.beginPath();
      ctx.moveTo(0, -170);
      ctx.lineTo(0, -(380 + level*35));
      ctx.strokeStyle = `rgba(184,134,43,${0.06 + level*0.02})`;
      ctx.lineWidth = level >= 6 ? 5 : 3;
      ctx.stroke();
    }
    ctx.restore();
  }

  // --- 外枠（レベルが上がるほど二重・三重に） ---
  const frameCount = level >= 6 ? 3 : (level >= 4 ? 2 : 1);
  for(let i=0; i<frameCount; i++){
    const inset = 48 + i*22;
    ctx.globalAlpha = 1 - i*0.3;
    ctx.strokeStyle = '#B8862B';
    ctx.lineWidth = 3 - i*0.5;
    ctx.strokeRect(inset, inset, W-inset*2, H-inset*2);
  }
  ctx.globalAlpha = 1;

  // --- 四隅の飾り：レベル4以上 ---
  if(level >= 4){
    [[92,92],[W-92,92],[92,H-92],[W-92,H-92]].forEach(([x,y])=>{
      drawDiamond(ctx, x, y, level >= 6 ? 20 : 13, '#B8862B');
    });
  }

  // --- キラキラ：レベル5以上 ---
  if(level >= 5){
    const sparkCount = level >= 6 ? 16 : 9;
    for(let i=0; i<sparkCount; i++){
      const ang = (Math.PI*2/sparkCount) * i + (i%2)*0.2;
      const dist = 250 + (i%3)*70;
      const x = cx + Math.cos(ang)*dist;
      const y = cy + Math.sin(ang)*dist*0.85;
      drawSparkle(ctx, x, y, 6 + (i%3)*4, '#F5EEDD', 0.85);
    }
  }

  ctx.textAlign = 'center';

  ctx.fillStyle = '#B8862B';
  ctx.font = '28px sans-serif';
  ctx.fillText('『影響力の正体』30日チャレンジ', cx, 190);

  // --- 数字（レベルが上がるほど光彩が強くなる） ---
  ctx.save();
  ctx.shadowColor = '#B8862B';
  ctx.shadowBlur = 6 + level*10;
  ctx.fillStyle = '#FBF8F2';
  ctx.font = 'bold 220px serif';
  ctx.fillText(streak, cx, 500);
  ctx.restore();

  ctx.fillStyle = '#FBF8F2';
  ctx.font = '40px serif';
  ctx.fillText('日、連続達成', cx, 580);

  ctx.fillStyle = '#8A9A7E';
  ctx.font = '26px sans-serif';
  ctx.fillText(isPeak ? '30日、走りきりました。' : `残り ${TOTAL - streak} 日`, cx, 660);

  // divider
  ctx.strokeStyle = 'rgba(184,134,43,0.5)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(cx-100, 740);
  ctx.lineTo(cx+100, 740);
  ctx.stroke();

  ctx.fillStyle = 'rgba(251,248,242,0.7)';
  ctx.font = '24px sans-serif';
  ctx.fillText('「知っている」を「できる」に変える30日間', cx, 800);
  ctx.fillText('中島侑子', cx, 850);

  // --- ピーク（30日）だけの特別演出 ---
  if(isPeak){
    ctx.save();
    ctx.shadowColor = '#B8862B';
    ctx.shadowBlur = 18;
    ctx.fillStyle = '#B8862B';
    ctx.font = 'bold 32px serif';
    ctx.fillText('C O M P L E T E', cx, 920);
    ctx.restore();
  }
}

function showShareCard(streak){
  drawShareCard(streak);
  document.getElementById('modalTitle').textContent =
    streak >= TOTAL ? '30日間、走りきりました' : `${streak}日連続、達成です`;
  document.getElementById('modalBg').classList.add('open');
}

document.getElementById('closeBtn').addEventListener('click', ()=>{
  document.getElementById('modalBg').classList.remove('open');
});
document.getElementById('saveBtn').addEventListener('click', ()=>{
  const canvas = document.getElementById('shareCanvas');
  const link = document.createElement('a');
  link.download = 'influence-30day-streak.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
});

loadState();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
</body>
</html>
